apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certManager.certificateName }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.certManager.secretName }}
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: Issuer

# DNS names are not user configurable so we try to render them using helper.tpl in template itself
  dnsNames:
    - {{ include "webhook-server.fullname" . }}
    - {{ include "webhook-server.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "webhook-server.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "webhook-server.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local