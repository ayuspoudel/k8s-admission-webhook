apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ include "webhook-server.fullname" . }}
  ports:
  - name: https
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
