image:
  repository: ayuspoudel/webhook-server
  tag: 1.0.1
  pullPolicy: Always

replicaCount: 1
readinessProbe: "/healthz"
service:
  port: 443
  targetPort: 8443

webhook:
  path: /validate
  timeoutSeconds: 5
  failurePolicy: Fail
createNamespace: false

excludeNamespaces:
  - webhook-test
resources: {}
certManager:
  issuerName: webhook-selfsigned
  certificateName: webhook-server-cert
  secretName: webhook-tls
